<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXURY CAR - Đăng nhập</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Animated cars background */
        .cars-bg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .car {
            position: absolute;
            font-size: 60px;
            opacity: 0.1;
            animation: drive linear infinite;
        }

        @keyframes drive {
            from { transform: translateX(-100px); }
            to { transform: translateX(calc(100vw + 100px)); }
        }

        .login-container {
            background: rgba(255,255,255,0.95);
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            width: 480px;
            padding: 50px;
            position: relative;
            z-index: 10;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            font-size: 70px;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #1a1a2e;
            font-size: 28px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 35px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            align-items: center;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            transition: all 0.3s;
            background: white;
        }

        .input-group i {
            padding: 0 18px;
            color: #999;
            font-size: 18px;
        }

        .input-group input {
            width: 100%;
            padding: 16px 18px 16px 0;
            border: none;
            border-radius: 15px;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            outline: none;
        }

        .input-group:focus-within {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.2);
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102,126,234,0.4);
        }

        .info-text {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 13px;
        }

        .info-text strong {
            color: #667eea;
        }

        .alert {
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="cars-bg">
        <div class="car" style="bottom: 10%; left: -100px; animation-duration: 15s;">🏎️</div>
        <div class="car" style="bottom: 25%; left: -100px; animation-duration: 20s; font-size: 45px;">🚗</div>
        <div class="car" style="bottom: 40%; left: -100px; animation-duration: 18s;">🏎️</div>
        <div class="car" style="bottom: 55%; left: -100px; animation-duration: 25s;">🚙</div>
    </div>

    <div class="login-container">
        <div class="logo">🏎️</div>
        <h2>LUXURY CAR</h2>
        <div class="subtitle">Premium Dealership Management</div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method="POST" action="/login">
            <div class="form-group">
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="text" name="username" placeholder="Tên đăng nhập" required>
                </div>
            </div>
            <div class="form-group">
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" placeholder="Mật khẩu" required>
                </div>
            </div>
            <button type="submit">
                <i class="fas fa-arrow-right"></i> Đăng nhập
            </button>
        </form>
        
        <div class="info-text">
            🔐 Demo Account: <strong>admin</strong> / <strong>admin123</strong>
        </div>
    </div>
</body>
</html>
